name: CI/CD Pipeline with Tests

on:
  push:
    branches: [ "master" ]

permissions:
  contents: read
  packages: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Jest and run tests
        run: |
          cd frontend
          npm install --save-dev jest
          npx jest

  integration-tests:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: crm_db
          MYSQL_USER: crm_user
          MYSQL_PASSWORD: crm_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MySQL Client
        run: sudo apt-get install -y mysql-client

      - name: Initialize Database
        run: |
          mysql -h 127.0.0.1 -u crm_user -pcrm_password crm_db < db/init.sql

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Run CRUD Integration Test
        env:
          DB_HOST: 127.0.0.1
        run: php backend/tests/crud_test.php

  build-and-push:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests] 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        run: echo "OWNER_LC=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/crm-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/crm-frontend:latest

      - name: Build and push proxy
        uses: docker/build-push-action@v6
        with:
          context: ./proxy
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/crm-proxy:latest

  deploy-simulation:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Simulate Deployment to Swarm
        run: |
          echo "Все тесты пройдены, образы успешно собраны и отправлены в GHCR"