name: CI/CD Pipeline to GHCR

on:
  push:
    branches: [ "master" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/crm-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/crm-frontend:latest

      - name: Build and push proxy
        uses: docker/build-push-action@v6
        with:
          context: ./proxy
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/crm-proxy:latest

  deploy-simulation:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Simulate Deployment to Swarm
        run: |
          echo "Образы успешно собраны и отправлены"