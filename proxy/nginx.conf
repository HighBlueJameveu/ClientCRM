events {}
http {
    resolver 127.0.0.11 valid=10s;
    server {
        listen 80;

        location /api/ {
            set $backend_upstream http://backend:80;
            proxy_pass http://backend:80/;
        }

        location / {
            set $frontend_upstream http://frontend:80;
            proxy_pass http://frontend:80;
        }
    }
}